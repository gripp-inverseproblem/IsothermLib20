# Publishes the pre-built manual in html/ to GitHub Pages.
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions
name: Publish manual

on:
  push:
    branches: [main]
    paths: ["html/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: html
      - id: deployment
        uses: actions/deploy-pages@v4
